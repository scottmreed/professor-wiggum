# Keep ChemIllusion's embedded mechanism runtime in step with Wiggum main.
#
# ChemIllusion (scottmreed/chem-art-generator, private) bakes a pinned checkout of
# this repo into its API image: `ARG WIGGUM_RUNTIME_REF=<sha>` in
# backend/Dockerfile.api, product model = MECHANISM_PREDICTOR_MODEL default in
# backend/app/core/config.py. When main changes anything the runtime ships
# (prompts/few-shots, harness, model catalog, runtime code, FlowER asset
# manifest, dependencies) or a published leaderboard result crowns a new model,
# this opens — or refreshes — one PR there (branch bot/wiggum-runtime-bump).
# Merging it redeploys via Railway (watchPatterns backend/**). Never auto-merged.
#
# Needs repository secret CHEMILLUSION_REPO_TOKEN: a fine-grained PAT (or GitHub
# App token) with Contents + Pull requests read/write on chem-art-generator.
# Without it the job only writes a summary with the manual bump.
name: ChemIllusion runtime bump

on:
  push:
    branches: [main]
    paths:
      - "skills/mechanistic/**"
      - "harness_versions/**"
      - "mechanistic_agent/**"
      - "novelty_index/manifest.json"
      - "pyproject.toml"
      - "requirements.txt"
      - "results/runs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Wiggum ref to roll ChemIllusion to"
        required: false
        default: "main"

concurrency:
  group: chemillusion-runtime-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      CHEMILLUSION_REPO: scottmreed/chem-art-generator
      BRANCH: bot/wiggum-runtime-bump
      GH_TOKEN: ${{ secrets.CHEMILLUSION_REPO_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::CHEMILLUSION_REPO_TOKEN is not set; skipping the ChemIllusion bump PR."
            {
              echo "### ChemIllusion runtime bump skipped"
              echo ""
              echo "Add repository secret \`CHEMILLUSION_REPO_TOKEN\` (Contents + Pull requests read/write on \`$CHEMILLUSION_REPO\`)."
              echo "Manual bump: set \`ARG WIGGUM_RUNTIME_REF=${GITHUB_SHA}\` in \`backend/Dockerfile.api\` and open a PR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.token.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Clone ChemIllusion
        if: steps.token.outputs.skip != 'true'
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${CHEMILLUSION_REPO}.git" chemillusion

      - name: Plan bump
        id: plan
        if: steps.token.outputs.skip != 'true'
        run: |
          python scripts/chemillusion_runtime_bump.py --chemillusion-dir chemillusion --apply --body-out body.md > plan.json
          cat plan.json
          echo "changed=$(jq -r .changed plan.json)" >> "$GITHUB_OUTPUT"
          echo "new_ref=$(jq -r .new_ref plan.json)" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.model_recommendation.model // empty' plan.json)" >> "$GITHUB_OUTPUT"
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the ChemIllusion PR
        if: steps.plan.outputs.changed == 'true'
        env:
          NEW_REF: ${{ steps.plan.outputs.new_ref }}
          NEW_MODEL: ${{ steps.plan.outputs.model }}
        run: |
          title="chore(mechanism): roll Wiggum runtime to ${NEW_REF:0:12}"
          if [ -n "$NEW_MODEL" ]; then title="$title; product model ${NEW_MODEL}"; fi
          cd chemillusion
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "$title" -m "Generated by scottmreed/professor-wiggum .github/workflows/chemillusion-runtime-bump.yml"
          git push --force origin "$BRANCH"
          existing=$(gh pr list -R "$CHEMILLUSION_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" -R "$CHEMILLUSION_REPO" --title "$title" --body-file ../body.md
          else
            gh pr create -R "$CHEMILLUSION_REPO" --base main --head "$BRANCH" --title "$title" --body-file ../body.md
          fi
